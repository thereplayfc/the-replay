name: The Replay — Match Watcher

on:
  schedule:
    # Runs every 10 minutes during match hours (10:00–23:00 UTC)
    # Covers all European evening kickoffs and afternoon matches
    - cron: '*/10 10-23 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore processed matches cache
        uses: actions/cache@v4
        with:
          path: logs/processed.json
          key: processed-matches-${{ github.run_number }}
          restore-keys: |
            processed-matches-

      - name: Create logs and output dirs
        run: mkdir -p logs output

      - name: Run match watcher (single poll)
        env:
          API_FOOTBALL_KEY:      ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CHANNEL_ID:    ${{ secrets.YOUTUBE_CHANNEL_ID }}
          TIKTOK_CLIENT_KEY:     ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET:  ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN:   ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN:${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/github_actions_runner.py

      - name: Save processed matches cache
        uses: actions/cache@v4
        if: always()
        with:
          path: logs/processed.json
          key: processed-matches-${{ github.run_number }}
